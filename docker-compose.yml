services:
  database:
    image: mysql:8.0.43
    container_name: borrowhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Root@BorrowHub2026}
      MYSQL_DATABASE: ${DB_NAME:-borrowhub_db}
      MYSQL_USER: ${DB_USERNAME:-borrowhub_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-BorrowHub@2026}
      TZ: Asia/Kolkata
    command:
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=+05:30
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-borrowhub_user}", "-p${DB_PASSWORD:-BorrowHub@2026}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./borrowhub-backend
      dockerfile: Dockerfile
    container_name: borrowhub-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-borrowhub_db}
      DB_USERNAME: ${DB_USERNAME:-borrowhub_user}
      DB_PASSWORD: ${DB_PASSWORD:-BorrowHub@2026}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      BORROWHUB_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
      BORROWHUB_SEED_ADMIN_PASSWORD: ${BORROWHUB_SEED_ADMIN_PASSWORD:-Admin@123}
      BORROWHUB_SEED_FACULTY_PASSWORD: ${BORROWHUB_SEED_FACULTY_PASSWORD:-Faculty@123}
      BORROWHUB_SEED_STAFF_PASSWORD: ${BORROWHUB_SEED_STAFF_PASSWORD:-Staff@123}
      BORROWHUB_SEED_STUDENT_PASSWORD: ${BORROWHUB_SEED_STUDENT_PASSWORD:-Student@123}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./borrowhub-frontend
      dockerfile: Dockerfile
    container_name: borrowhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  mysql_data:
    driver: local
